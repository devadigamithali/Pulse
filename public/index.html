<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Pulse</title>
  <style>
    body {
      font-family: system-ui, Arial, sans-serif;
      max-width: 640px;
      margin: 40px auto;
      padding: 0 16px;
      color: #222;
    }
    h1 { margin-bottom: 4px; }
    .article {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 12px 16px;
      margin: 12px 0;
    }
    .article h2 { font-size: 16px; margin: 0 0 4px; }
    .topic { color: #777; font-size: 13px; margin-bottom: 8px; }
    button {
      font-size: 14px;
      padding: 6px 12px;
      border: 1px solid #888;
      border-radius: 6px;
      background: #fff;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <h1>Pulse</h1>
  <p>Today's articles</p>
  <div id="list">Loading…</div>


  <script>
    // We keep the latest list of saved ids here so each button
    // knows whether its article is currently saved.
    let savedIds = [];


    // ----- When the page opens, load everything in order -----

    // Step 1: ask the server which articles are already saved.
    fetch("/saved")
      .then((reply) => reply.json())
      .then((ids) => {
        savedIds = ids;

        // Step 2: now ask for the articles themselves.
        return fetch("/articles");
      })
      .then((reply) => reply.json())
      .then((articles) => {
        // Step 3: show them on the page.
        showArticles(articles);
      })
      .catch(() => {
        document.getElementById("list").textContent =
          "Could not load articles. Is the server running?";
      });


    // ----- Build the list of article cards -----
    function showArticles(articles) {
      const list = document.getElementById("list");
      list.innerHTML = "";

      articles.forEach((article) => {
        const card = document.createElement("div");
        card.className = "article";

        // Is this article already in our saved list?
        const isSaved = savedIds.includes(article.id);

        card.innerHTML =
          "<h2>" + article.title + "</h2>" +
          "<div class='topic'>" + article.topic + "</div>";

        // Make the Save button and set its starting text.
        const button = document.createElement("button");
        button.textContent = isSaved ? "Saved ✓" : "Save";

        // When clicked, run toggleSave for this article.
        button.onclick = () => toggleSave(article.id, button);

        card.appendChild(button);
        list.appendChild(card);
      });
    }


    // ----- Save or unsave when a button is clicked -----
    function toggleSave(id, button) {
      const isSaved = savedIds.includes(id);

      if (isSaved) {
        // Already saved -> ask the server to REMOVE it (DELETE).
        fetch("/saved/" + id, { method: "DELETE" })
          .then((reply) => reply.json())
          .then((ids) => {
            savedIds = ids;
            button.textContent = "Save";
          });
      } else {
        // Not saved yet -> SEND it to the server to save (POST).
        fetch("/saved", {
          method: "POST",                                   // the kind of request
          headers: { "Content-Type": "application/json" },  // "I'm sending JSON"
          body: JSON.stringify({ id: id }),                 // the data, as text
        })
          .then((reply) => reply.json())
          .then((ids) => {
            savedIds = ids;
            button.textContent = "Saved ✓";
          });
      }
    }
  </script>
</body>
</html>
