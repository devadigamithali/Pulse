<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Pulse</title>
  <style>
    body {
      font-family: system-ui, Arial, sans-serif;
      max-width: 640px;
      margin: 40px auto;
      padding: 0 16px;
      color: #222;
    }
    h1 { margin-bottom: 4px; }
    .article {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 12px 16px;
      margin: 12px 0;
    }
    .article h2 { font-size: 16px; margin: 0 0 4px; }
    .article h2 a { color: #1d4e57; text-decoration: none; }
    .article h2 a:hover { text-decoration: underline; }
    .topic { color: #777; font-size: 13px; margin-bottom: 8px; }
    button {
      font-size: 14px; padding: 6px 12px; border: 1px solid #888;
      border-radius: 6px; background: #fff; cursor: pointer;
    }
  </style>
</head>

<body>
  <h1>Pulse</h1>
  <p>Today's articles</p>
  <div id="list">Loading…</div>

  <script>
    let savedIds = [];

    fetch("/saved")
      .then((reply) => reply.json())
      .then((ids) => {
        savedIds = ids;
        return fetch("/articles");
      })
      .then((reply) => reply.json())
      .then((articles) => showArticles(articles))
      .catch(() => {
        document.getElementById("list").textContent =
          "Could not load articles. Is the server running?";
      });

    function showArticles(articles) {
      const list = document.getElementById("list");
      list.innerHTML = "";

      articles.forEach((article) => {
        const card = document.createElement("div");
        card.className = "article";

        const isSaved = savedIds.includes(article.id);

        // NEW: the title is now a link to the detail page.
        // We attach the article's id to the address: article.html?id=2
        card.innerHTML =
          "<h2><a href='article.html?id=" + article.id + "'>" +
              article.title +
          "</a></h2>" +
          "<div class='topic'>" + article.summary + "</div>";

        const button = document.createElement("button");
        button.textContent = isSaved ? "Saved ✓" : "Save";
        button.onclick = () => toggleSave(article.id, button);

        card.appendChild(button);
        list.appendChild(card);
      });
    }

    function toggleSave(id, button) {
      const isSaved = savedIds.includes(id);
      if (isSaved) {
        fetch("/saved/" + id, { method: "DELETE" })
          .then((reply) => reply.json())
          .then((ids) => {
            savedIds = ids;
            button.textContent = "Save";
          });
      } else {
        fetch("/saved", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id: id }),
        })
          .then((reply) => reply.json())
          .then((ids) => {
            savedIds = ids;
            button.textContent = "Saved ✓";
          });
      }
    }
  </script>
</body>
</html>
